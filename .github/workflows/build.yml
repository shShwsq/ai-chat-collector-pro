# 自动打包：浏览器插件（zip）+ 桌面应用（Windows NSIS 安装包）
#
# 产物：
#   - ai-chat-collector-extension-v<版本>.zip   未打包扩展，Chrome「加载已解压」或分发
#   - knowledge-work-assistant-windows           Electron NSIS 安装包（含 backend 源码）
#
# 触发：推送到 main / 推送 v* 标签 / 手动运行。打 v* 标签时会额外发布 GitHub Release。
name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. 浏览器插件：无构建步骤，直接把运行时文件打成 zip
  # ──────────────────────────────────────────────────────────────────────────
  build-plugin:
    name: Package browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ai-chat-collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-ai-chat-collector/package-lock.json

      - run: npm ci

      # 跑测试套件（407 用例）作为打包前置门禁
      - run: npm test

      - name: 读取扩展版本号
        id: ver
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 校验 manifest.json
        run: |
          python3 -c "
          import json
          with open('manifest.json') as f:
              m = json.load(f)
          assert m.get('manifest_version') == 3, 'manifest_version must be 3'
          assert m.get('name'), 'name is required'
          assert m.get('version'), 'version is required'
          print(f'Extension: {m[\"name\"]} v{m[\"version\"]}')
          "

      - name: 校验 models.json
        run: |
          python3 -c "
          import json
          with open('models.json') as f:
              m = json.load(f)
          assert 'llmProviders' in m, 'models.json missing llmProviders section'
          assert 'embeddingProviders' in m, 'models.json missing embeddingProviders section'
          assert isinstance(m['llmProviders'], list) and len(m['llmProviders']) > 0, 'llmProviders empty'
          assert isinstance(m['embeddingProviders'], list) and len(m['embeddingProviders']) > 0, 'embeddingProviders empty'
          for v in m['llmProviders']:
              assert v.get('id'), 'llm provider missing id'
              assert v.get('models'), f'llm provider {v.get(\"id\")} missing models'
          for v in m['embeddingProviders']:
              assert v.get('id'), 'embedding provider missing id'
              assert v.get('models'), f'embedding provider {v.get(\"id\")} missing models'
          print(f'models.json: {len(m[\"llmProviders\"])} LLM providers, {len(m[\"embeddingProviders\"])} embedding providers')
          "

      - name: 检查自研 JS 语法（acorn）
        run: |
          npm install -g acorn
          errors=0
          # 检查所有自研 JS：排除 node_modules / tests（ES module 语法）/ 第三方 *.min.js
          for f in $(find . -name '*.js' \
                       -not -path './node_modules/*' \
                       -not -path './tests/*' \
                       -not -name '*.min.js'); do
            if ! acorn --ecma2020 "$f" > /dev/null 2>&1; then
              echo "Syntax error in $f"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors file(s) with syntax errors"
            exit 1
          fi
          echo "All JS files passed syntax check"

      - name: 校验 SKILL 配套 Python 脚本语法
        run: |
          python3 -m py_compile docs/skills/scripts/query_knowledge.py && \
            echo "query_knowledge.py syntax OK"

      - name: 打包扩展为 zip
        run: |
          mkdir -p dist
          # 注意：不排除 *.md。docs/*-setup.md 是运行时帮助文档，由 popup/settings.js
          #   通过 chrome.runtime.getURL + fetch 加载，必须打包；docs/skills/ 供用户下载。
          # docs/skills/.env 含 API Key，绝不能进 release（.gitignore 已忽略，但 zip 不读 .gitignore）。
          zip -r "dist/ai-chat-collector-v${{ steps.ver.outputs.version }}.zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "references/*" \
            -x "dist/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x ".gitignore" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "vitest.config.js" \
            -x "docs/skills/.env" \
            -x "*/__pycache__/*" \
            -x "*/*/__pycache__/*" \
            -x "*/*/*/__pycache__/*"

      - name: 安全验证：zip 不得包含 .env / __pycache__
        run: |
          if unzip -l "dist/ai-chat-collector-v${{ steps.ver.outputs.version }}.zip" | grep -E '(\.env$|__pycache__)'; then
            echo "::error::Release zip contains sensitive files (.env / __pycache__)!"
            exit 1
          fi
          echo "Release zip verified clean (no .env / __pycache__)"

      - name: 验证运行时帮助文档已打包
        run: |
          missing=0
          for f in docs/chroma-setup.md docs/milvus-setup.md docs/pgvector-setup.md \
                   docs/supabase-setup.md docs/qdrant-setup.md; do
            if ! unzip -l "dist/ai-chat-collector-v${{ steps.ver.outputs.version }}.zip" | grep -q "$f"; then
              echo "::error::Missing runtime help doc: $f"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then exit 1; fi
          echo "All runtime help docs present"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-chat-collector-extension-v${{ steps.ver.outputs.version }}
          path: web-ai-chat-collector/dist/ai-chat-collector-v${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # 2. 桌面应用：pnpm dist → electron-builder 产出 Windows NSIS 安装包
  #    electron-builder 的 extraResources 会把 ../backend 源码打进安装包
  # ──────────────────────────────────────────────────────────────────────────
  build-app:
    name: Package desktop app (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: knowledge-work-assistant/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: knowledge-work-assistant/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # build:frontend（tsc + vite build）→ build:electron（tsc）→ electron-builder --win
      - run: pnpm dist

      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-work-assistant-windows
          path: knowledge-work-assistant/frontend/release/*
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # 3. 打 v* 标签时：把两个产物发布到 GitHub Release
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-plugin, build-app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.yml
