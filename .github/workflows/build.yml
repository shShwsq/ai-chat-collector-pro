# 自动打包：浏览器插件（zip）+ 桌面应用（Windows NSIS 安装包）
#
# 产物：
#   - echolog-extension-v<版本>.zip   未打包扩展，Chrome「加载已解压」或分发
#   - echolog-desktop-windows           Electron NSIS 安装包（含 PyInstaller 打包的 backend，零额外依赖）
#
# 触发：推送到 main / 推送 v* 标签 / 手动运行。打 v* 标签时会额外发布 GitHub Release。
name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. 浏览器插件：无构建步骤，直接把运行时文件打成 zip
  # ──────────────────────────────────────────────────────────────────────────
  build-plugin:
    name: Package browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ai-chat-collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ai-chat-collector/package-lock.json

      - run: npm ci

      # 跑测试套件（407 用例）作为打包前置门禁
      - run: npm test

      - name: 读取扩展版本号
        id: ver
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 校验 manifest.json
        run: |
          python3 -c "
          import json
          with open('manifest.json') as f:
              m = json.load(f)
          assert m.get('manifest_version') == 3, 'manifest_version must be 3'
          assert m.get('name'), 'name is required'
          assert m.get('version'), 'version is required'
          print(f'Extension: {m[\"name\"]} v{m[\"version\"]}')
          "

      - name: 校验 models.json
        run: |
          python3 -c "
          import json
          with open('models.json') as f:
              m = json.load(f)
          assert 'llmProviders' in m, 'models.json missing llmProviders section'
          assert 'embeddingProviders' in m, 'models.json missing embeddingProviders section'
          assert isinstance(m['llmProviders'], list) and len(m['llmProviders']) > 0, 'llmProviders empty'
          assert isinstance(m['embeddingProviders'], list) and len(m['embeddingProviders']) > 0, 'embeddingProviders empty'
          for v in m['llmProviders']:
              assert v.get('id'), 'llm provider missing id'
              assert v.get('models'), f'llm provider {v.get(\"id\")} missing models'
          for v in m['embeddingProviders']:
              assert v.get('id'), 'embedding provider missing id'
              assert v.get('models'), f'embedding provider {v.get(\"id\")} missing models'
          print(f'models.json: {len(m[\"llmProviders\"])} LLM providers, {len(m[\"embeddingProviders\"])} embedding providers')
          "

      - name: 检查自研 JS 语法（acorn）
        run: |
          npm install -g acorn
          errors=0
          # 检查所有自研 JS：排除 node_modules / tests / *.config.js（ES module 语法）/ 第三方 *.min.js
          for f in $(find . -name '*.js' \
                       -not -path './node_modules/*' \
                       -not -path './tests/*' \
                       -not -name '*.config.js' \
                       -not -name '*.min.js'); do
            if ! acorn --ecma2020 "$f" > /dev/null 2>&1; then
              echo "Syntax error in $f"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors file(s) with syntax errors"
            exit 1
          fi
          echo "All JS files passed syntax check"

      - name: 校验 SKILL 配套 Python 脚本语法
        run: |
          python3 -m py_compile docs/skills/scripts/query_knowledge.py && \
            echo "query_knowledge.py syntax OK"

      - name: 打包扩展为 zip
        run: |
          mkdir -p dist
          # 注意：不排除 *.md。docs/*-setup.md 是运行时帮助文档，由 popup/settings.js
          #   通过 chrome.runtime.getURL + fetch 加载，必须打包；docs/skills/ 供用户下载。
          # docs/skills/.env 含 API Key，绝不能进 release（.gitignore 已忽略，但 zip 不读 .gitignore）。
          zip -r "dist/echolog-extension-v${{ steps.ver.outputs.version }}.zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "references/*" \
            -x "dist/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x ".gitignore" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "vitest.config.js" \
            -x "docs/skills/.env" \
            -x "*/__pycache__/*" \
            -x "*/*/__pycache__/*" \
            -x "*/*/*/__pycache__/*"

      - name: 安全验证：zip 不得包含 .env / __pycache__
        run: |
          if unzip -l "dist/echolog-extension-v${{ steps.ver.outputs.version }}.zip" | grep -E '(\.env$|__pycache__)'; then
            echo "::error::Release zip contains sensitive files (.env / __pycache__)!"
            exit 1
          fi
          echo "Release zip verified clean (no .env / __pycache__)"

      - name: 验证运行时帮助文档已打包
        run: |
          missing=0
          for f in docs/chroma-setup.md docs/milvus-setup.md docs/pgvector-setup.md \
                   docs/supabase-setup.md docs/qdrant-setup.md; do
            if ! unzip -l "dist/echolog-extension-v${{ steps.ver.outputs.version }}.zip" | grep -q "$f"; then
              echo "::error::Missing runtime help doc: $f"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then exit 1; fi
          echo "All runtime help docs present"

      - uses: actions/upload-artifact@v4
        with:
          name: echolog-extension-v${{ steps.ver.outputs.version }}
          path: web-ai-chat-collector/dist/echolog-extension-v${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # 2. 桌面应用：PyInstaller 打包 backend → pnpm dist → electron-builder 产出
  #    Windows NSIS 安装包 / macOS dmg。extraResources 把 PyInstaller onedir 产物
  #    （含 Python 运行时与依赖）带入安装包，目标机器无需安装 Python。
  # ──────────────────────────────────────────────────────────────────────────
  build-app:
    name: Package desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: echolog-desktop-windows
          - os: macos-latest
            artifact: echolog-desktop-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: knowledge-work-assistant/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: knowledge-work-assistant/frontend/pnpm-lock.yaml

      # ===== 后端 PyInstaller 打包（产出 ../backend/dist/backend，供 extraResources 带入安装包）=====
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        working-directory: knowledge-work-assistant/backend
        run: uv sync --frozen --no-dev

      - name: Build backend with PyInstaller
        working-directory: knowledge-work-assistant/backend
        run: uv run --with pyinstaller pyinstaller backend.spec --noconfirm --clean

      - name: Verify backend binary built
        working-directory: knowledge-work-assistant/backend
        shell: bash
        run: |
          # Windows: backend.exe；macOS: backend（console=True 产出普通可执行文件，非 .app）
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f dist/backend/backend.exe && echo "backend.exe OK"
          else
            test -f dist/backend/backend && echo "backend OK"
          fi

      # ===== 前端打包（electron-builder，extraResources 指向 ../backend/dist/backend）=====
      - run: pnpm install --frozen-lockfile

      # 前端测试门禁：vitest 套件（含 api / ws / motion / importers / store 等），
      # 失败即中止打包，避免带 bug 的产物进入安装包。
      - run: pnpm test

      # build:frontend（tsc + vite build）→ build:electron（tsc）→ electron-builder
      # 不带 --win/--mac：按宿主平台构建（Windows→NSIS，macOS→dmg）
      - run: pnpm dist

      # macOS arm64 要求 .app bundle 内所有 Mach-O 可执行文件都有签名（哪怕是 ad-hoc）。
      # 但 electron-builder 不会递归签名 extraResources 里的可执行文件，而 PyInstaller 打包
      # 的 backend（backend.spec 里 codesign_identity=None）及其依赖的 .dylib/.so 全部未签名，
      # 导致整个 .app 的签名索引（CodeResources）与实际文件不一致 → Gatekeeper 在 arm64 上
      # 直接弹「移到废纸篓」，codesign -vvv 报 "code has no resources but signature indicates
      # they must be present"。
      # 修复：electron-builder 完成后，先逐个签名内嵌可执行文件与动态库，再 --deep 签名整个 bundle。
      - name: Ad-hoc sign all Mach-O binaries (macOS arm64 requirement)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="release/mac-arm64/对话回声.app"
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }

          # 1. 先签名所有内嵌可执行文件与动态库（PyInstaller backend + cryptography/pydantic_core/lxml 的 .dylib/.so）
          #    -perm +111 匹配可执行权限位的文件；扩展名匹配动态库。
          #    必须在 --deep 之前逐个签名，否则 --deep 会因发现未签名子二进制而生成不一致的 CodeResources。
          echo "Signing embedded Mach-O binaries..."
          find "$APP" -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) -print0 |
            while IFS= read -r -d '' f; do
              # 跳过明显的非 Mach-O 文件（文本脚本、JSON、证书等），避免 codesign 报错中断流程
              if file "$f" | grep -q 'Mach-O'; then
                codesign --force --sign - "$f"
              fi
            done

          # 2. --deep 签名整个 .app bundle，生成一致的 CodeResources 索引
          echo "Signing .app bundle..."
          codesign --force --deep --sign - "$APP"

          # 3. 验证签名完整性（失败则中止上传，避免发出坏签名的 dmg）
          echo "Verifying signature..."
          codesign -vvv --deep --strict "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # 只上传安装包本身，排除 win-unpacked/、builder-debug.yml 等中间产物
          path: |
            knowledge-work-assistant/frontend/release/*.exe
            knowledge-work-assistant/frontend/release/*.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # 3. 打 v* 标签时：把两个产物发布到 GitHub Release
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-plugin, build-app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.dmg
