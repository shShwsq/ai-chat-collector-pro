<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ai-chat-collector</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../lib/katex.min.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>ai-chat-collector</h1>
      <div class="status" id="status"></div>
      <button class="icon-btn" id="settingsBtn" title="AI 问答设置" aria-label="设置">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94 0 .31.04.64.09.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.21.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </header>

    <div class="toolbar">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索对话内容..." />
        <button id="searchBtn" class="btn btn-primary" title="搜索">搜索</button>
      </div>
    </div>

    <div class="toolbar">
      <select id="platformFilter" title="按平台筛选">
        <option value="">全部平台</option>
      </select>
      <div class="toolbar-spacer"></div>
      <button id="exportAllBtn" class="btn btn-primary" title="导出全部对话">导出全部</button>
      <button id="pushLocalBtn" class="btn btn-push-local" title="将对话记录发送到本地软件">发送到本地</button>
      <button id="refreshBtn" class="icon-btn" title="刷新列表" aria-label="刷新">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>

    <div class="conversation-list" id="conversationList">
      <div class="empty-state">暂无对话记录</div>
    </div>

    <!-- 推送结果临时提示条 -->
    <div class="popup-banner" id="pushBanner"></div>

    <!-- 完整对话查看弹窗 -->
    <div class="viewer-overlay" id="viewerOverlay">
      <div class="viewer-box">
        <div class="viewer-header">
          <h3 id="viewerTitle">对话详情</h3>
          <button class="viewer-close" id="viewerClose" aria-label="关闭">&times;</button>
        </div>
        <div class="viewer-body" id="viewerBody"></div>
      </div>
    </div>
  </div>

  <script src="../lib/marked.min.js"></script>
  <script src="../lib/sanitize-html.js"></script>
  <script src="../lib/katex.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
