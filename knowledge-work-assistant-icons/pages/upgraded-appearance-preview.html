<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识工作助手 · 升级外观预览</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    :root {
      --bg-deep: #0b1220;
      --bg-panel: rgba(22, 34, 54, 0.72);
      --accent: #2dd4bf;
      --accent-2: #3b82f6;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.16);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at 20% 10%, #142238 0%, var(--bg-deep) 55%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 40px;
    }
    .preview-frame {
      max-width: 1400px;
      margin: 0 auto;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-mark {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center;
      font-weight: 800; font-size: 18px; color: #0b1220;
    }
    .brand-title { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
    .brand-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .nav-pills { display: flex; gap: 10px; }
    .pill {
      padding: 8px 16px; border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      font-size: 13px; color: var(--text-muted);
    }
    .pill.active { color: var(--accent); border-color: rgba(45, 212, 191, 0.35); background: rgba(45, 212, 191, 0.08); }
    .dashboard {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      gap: 24px;
      padding: 28px;
    }
    .panel {
      background: var(--bg-panel);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
    }
    .panel h2 { margin: 0 0 18px; font-size: 15px; font-weight: 600; color: var(--text-main); }
    .chat-area { display: flex; flex-direction: column; gap: 14px; }
    .bubble {
      padding: 14px 16px; border-radius: 16px;
      font-size: 13.5px; line-height: 1.55;
      max-width: 92%;
    }
    .bubble.user {
      background: linear-gradient(135deg, rgba(59,130,246,0.25), rgba(45,212,191,0.18));
      border: 1px solid rgba(59,130,246,0.25);
      align-self: flex-end;
    }
    .bubble.ai {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      align-self: flex-start;
    }
    .input-bar {
      margin-top: auto;
      display: flex; gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0,0,0,0.18);
      border: 1px solid var(--border);
    }
    .input-bar input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text-main); font-size: 13px;
    }
    .input-bar button {
      width: 32px; height: 32px; border-radius: 10px;
      border: none; background: var(--accent); color: #0b1220;
      display: grid; place-items: center; cursor: pointer;
    }
    .graph {
      min-height: 360px;
      display: grid; place-items: center;
      position: relative;
    }
    .graph svg { width: 100%; height: 100%; max-height: 360px; }
    .rec-list { display: flex; flex-direction: column; gap: 12px; }
    .rec-card {
      padding: 14px; border-radius: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
    }
    .rec-card h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
    .rec-card p { margin: 0; font-size: 12px; color: var(--text-muted); line-height: 1.45; }
    .plugin-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .plugin-tag {
      padding: 6px 10px; border-radius: 8px;
      background: rgba(45, 212, 191, 0.08);
      border: 1px solid rgba(45, 212, 191, 0.22);
      font-size: 11px; color: var(--accent);
    }
    .icon-showcase {
      grid-column: 1 / -1;
      padding: 24px;
    }
    .icon-showcase h2 { margin: 0 0 18px; font-size: 15px; font-weight: 600; }
    .icon-showcase img {
      width: 100%; border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
    }
    .badge-row {
      display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .badge {
      padding: 5px 12px; border-radius: 999px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.22);
      font-size
