<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>KWA 推送测试</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <h1>KWA 推送测试</h1>
    <p class="app-sub">kwa-push SDK 最小示例</p>
  </header>

  <section class="card">
    <div class="row">
      <span class="label">Webhook URL</span>
      <code id="webhook-url" class="url" title="后端推送端点">--</code>
    </div>

    <button id="push-btn" type="button" class="btn-primary">推送测试对话</button>

    <div id="result" class="result result-idle">尚未推送</div>
  </section>

  <section class="card">
    <h2 class="section-title">测试对话预览</h2>
    <pre id="preview" class="preview"></pre>
  </section>

  <script src="popup.js"></script>
</body>
</html>
