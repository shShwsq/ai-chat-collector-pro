[project]
name = "knowledge-work-assistant-backend"
version = "0.0.0"
description = "知识工作助手后端 - FastAPI Agent 服务（双模式 Study/Work 知识图谱），由步影项目骨架适配而来"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.35.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.2",
    "Pillow>=10.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "python-pptx>=0.6.23",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # httpx 已在主依赖中，测试用 ASGITransport + AsyncClient 也依赖它，
    # 此处显式列出以便「测试依赖」清单完整（参见 spec E 段验证项）
    "httpx>=0.27.0",
    "httpx-ws>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 测试根目录指向 backend/tests，避免误收集 app/ 下非测试文件
testpaths = ["tests"]
# 同时收集 tests/ 下的 e2e 子目录
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
